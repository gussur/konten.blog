name: Test WordPress Draft

on:
  workflow_dispatch: # Mengizinkan eksekusi manual dari tab Actions

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create Draft Post in WordPress
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import urllib.request
          import json
          import os
          import base64

          # Mengambil environment variables
          wp_url = os.environ.get('WP_URL', '').strip().rstrip('/')
          wp_username = os.environ.get('WP_USERNAME', '').strip()
          wp_password = os.environ.get('WP_APP_PASSWORD', '').strip()

          # Validasi apakah WP_URL kosong
          if not wp_url:
              print("ERROR: WP_URL kosong! Pastikan Secret WP_URL sudah dibuat di Settings.")
              exit(1)
          elif not wp_url.startswith('http'):
              print(f"ERROR: WP_URL harus diawali https:// (Saat ini: {wp_url})")
              exit(1)

          api_url = f"{wp_url}/wp-json/wp/v2/posts"
          
          # Membuat token autentikasi
          credentials = f"{wp_username}:{wp_password}"
          token = base64.b64encode(credentials.encode()).decode('utf-8')

          headers = {
              'Authorization': f'Basic {token}',
              'Content-Type': 'application/json'
          }

          data = {
              'title': 'Uji Otomatisasi Threads ke WordPress',
              'content': 'Jika kamu membaca ini, berarti integrasi GitHub Actions ke WordPress telah berhasil!',
              'status': 'draft'
          }

          req = urllib.request.Request(api_url, data=json.dumps(data).encode('utf-8'), headers=headers, method='POST')

          try:
              with urllib.request.urlopen(req) as response:
                  print(f"Sukses! Draft dibuat dengan status HTTP: {response.status}")
          except urllib.error.HTTPError as e:
              print(f"HTTP Error: {e.code} - {e.reason}")
              print(f"Detail dari WordPress: {e.read().decode()}")
              exit(1)
          except Exception as e:
              print(f"Error sistem: {e}")
              exit(1)
          PY
