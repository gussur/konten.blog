name: Sync Threads to WP and IG Carousel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Otomatis mengecek dan memposting setiap 1 jam sekali

jobs:
  sync-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pillow requests

      - name: Run Generator and Publisher
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import base64
          import json
          import time
          import requests
          from PIL import Image, ImageDraw, ImageFont
          import textwrap

          wp_url = os.environ.get('WP_URL', '').strip().rstrip('/')
          wp_username = os.environ.get('WP_USERNAME', '').strip()
          wp_password = os.environ.get('WP_APP_PASSWORD', '').strip()
          threads_token = os.environ.get('THREADS_ACCESS_TOKEN', '').strip()
          ig_user_id = os.environ.get('IG_USER_ID', '').strip()
          ig_access_token = os.environ.get('IG_ACCESS_TOKEN', '').strip()
          imgbb_key = os.environ.get('IMGBB_API_KEY', '').strip()

          # Unduh Font Google
          print("Mengunduh font...")
          font_serif_url = "https://github.com/google/fonts/raw/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"
          font_sans_url = "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"

          with open("font_serif.ttf", "wb") as f:
              f.write(requests.get(font_serif_url).content)
          with open("font_sans.ttf", "wb") as f:
              f.write(requests.get(font_sans_url).content)

          # 1. Ambil Utas Threads
          threads_api_url = f"https://graph.threads.net/v1.0/me/threads?fields=id,text,timestamp,media_type,username&access_token={threads_token}"
          res = requests.get(threads_api_url).json()
          posts = res.get('data', [])
          if not posts:
              print("Tidak ada utas Threads yang ditemukan.")
              exit(0)

          root_post = posts[0]
          root_id = root_post.get('id', '')
          root_text = root_post.get('text', '')
          root_username = root_post.get('username', '')

          thread_chain = [root_text]
          current_id = root_id

          if root_username:
              while True:
                  replies_url = f"https://graph.threads.net/v1.0/{current_id}/replies?fields=id,text,timestamp,username&access_token={threads_token}"
                  r_data = requests.get(replies_url).json()
                  replies = r_data.get('data', [])
                  if not replies:
                      break
                  replies.sort(key=lambda x: x.get('timestamp', ''))
                  next_part = None
                  for reply in replies:
                      if reply.get('username') == root_username:
                          next_part = reply
                          break
                  if next_part:
                      text = next_part.get('text', '')
                      if text:
                          thread_chain.append(text)
                      current_id = next_part.get('id')
                  else:
                      break

          print(f"Berhasil mengambil {len(thread_chain)} bagian utas Threads.")

          # 2. Desain Slide Carousel
          slides_text = thread_chain[:10]
          container_ids = []

          # Definisi Font Pas
          title_font = ImageFont.truetype("font_serif.ttf", 46) # Font Cover (Serif)
          body_font = ImageFont.truetype("font_sans.ttf", 36)   # Font Isi (Sans-Serif Rapat)
          header_font = ImageFont.truetype("font_sans.ttf", 24)

          for idx, text in enumerate(slides_text):
              img = Image.new('RGB', (1080, 1080), color='#FAF8F5')
              draw = ImageDraw.Draw(img)

              # Header
              draw.text((90, 80), "gussur.com — Laju Laku Lalu", fill='#555555', font=header_font)
              draw.text((930, 80), f"{idx + 1}/{len(slides_text)}", fill='#777777', font=header_font)
              draw.line([(90, 130), (990, 130)], fill='#E2E0DC', width=2)

              # Format Teks Rapat & Presisi
              if idx == 0:
                  current_font = title_font
                  line_width = 30
                  line_spacing = 10
              else:
                  current_font = body_font
                  line_width = 38
                  line_spacing = 8

              # Wrap paragraf tanpa spasi ganda liar
              paragraphs = [p.strip() for p in text.split('\n') if p.strip()]
              wrapped_paragraphs = ["\n".join(textwrap.wrap(p, width=line_width)) for p in paragraphs]
              final_text = "\n\n".join(wrapped_paragraphs)

              bbox = draw.multiline_textbbox((0, 0), final_text, font=current_font, align="left", spacing=line_spacing)
              text_h = bbox[3] - bbox[1]
              y_pos = (1080 - text_h) / 2

              draw.multiline_text((90, max(y_pos, 200)), final_text, fill='#1A1A1A', font=current_font, align="left", spacing=line_spacing)

              # Footer
              draw.line([(90, 950), (990, 950)], fill='#E2E0DC', width=2)
              draw.text((900, 980), "@gussur", fill='#444444', font=header_font)

              filename = f"slide_{idx}.png"
              img.save(filename)

              # Upload ke ImgBB
              with open(filename, "rb") as file:
                  imgbb_res = requests.post("https://api.imgbb.com/1/upload", data={"key": imgbb_key}, files={"image": file}).json()

              image_url = imgbb_res.get('data', {}).get('url')

              # Post Container IG
              item_url = f"https://graph.instagram.com/v20.0/{ig_user_id}/media"
              item_res = requests.post(
                  item_url,
                  params={'access_token': ig_access_token},
                  data={'image_url': image_url, 'is_carousel_item': 'true'}
              ).json()
              
              item_id = item_res.get('id')
              if item_id:
                  container_ids.append(item_id)
              else:
                  print(f"Error Item Slide {idx+1}: {item_res}")

          # 3. Gabungkan dan Cek Status Pemrosesan IG
          if container_ids:
              print("Membuat Induk Carousel IG...")
              carousel_url = f"https://graph.instagram.com/v20.0/{ig_user_id}/media"
              carousel_res = requests.post(
                  carousel_url,
                  params={'access_token': ig_access_token},
                  data={
                      'media_type': 'CAROUSEL',
                      'children': ','.join(container_ids),
                      'caption': f"{root_text}\n\n---\nUtas lengkap di gussur.com"
                  }
              ).json()
              
              creation_id = carousel_res.get('id')
              if creation_id:
                  print(f"Induk Carousel dibuat (ID: {creation_id}). Mengecek status siap publish...")
                  
                  is_ready = False
                  for attempt in range(10):
                      status_url = f"https://graph.instagram.com/v20.0/{creation_id}?fields=status_code&access_token={ig_access_token}"
                      status_res = requests.get(status_url).json()
                      status_code = status_res.get('status_code')
                      print(f"Pengecekan ke-{attempt+1}: status = {status_code}")
                      
                      if status_code == 'FINISHED':
                          is_ready = True
                          break
                      elif status_code == 'ERROR':
                          print(f"Meta membalas status ERROR: {status_res}")
                          break
                      time.sleep(5)

                  if is_ready:
                      publish_url = f"https://graph.instagram.com/v20.0/{ig_user_id}/media_publish"
                      pub_res = requests.post(
                          publish_url,
                          params={'access_token': ig_access_token},
                          data={'creation_id': creation_id}
                      ).json()
                      print(f"RESPON PUBLISH IG: {pub_res}")
                  else:
                      print("Gambar belum selesai diproses oleh Instagram, gagal publish.")
              else:
                  print(f"Gagal Buat Induk Carousel: {carousel_res}")

          # 4. Kirim ke WordPress
          formatted_paragraphs = ["<p>" + text.replace('\n', '<br>') + "</p>" for text in thread_chain if text]
          combined_content = "".join(formatted_paragraphs)
          title = (root_text[:50] + '...') if len(root_text) > 50 else root_text
          full_content = f"{combined_content}<br><hr><p><i>Diimpor otomatis dari Utas Threads ({len(thread_chain)} bagian)</i></p>"

          wp_api_url = f"{wp_url}/wp-json/wp/v2/posts"
          credentials = f"{wp_username}:{wp_password}"
          auth_token = base64.b64encode(credentials.encode()).decode('utf-8')
          headers = {'Authorization': f'Basic {auth_token}', 'Content-Type': 'application/json'}
          
          requests.post(wp_api_url, json={'title': f"[Threads] {title}", 'content': full_content, 'status': 'draft'}, headers=headers)
          print("Sukses kirim ke WordPress.")
          PY
