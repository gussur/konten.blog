name: Test WordPress Draft

on:
  workflow_dispatch:

jobs:
  create-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Create a WordPress draft
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          import urllib.error

          wp_url = os.environ["WP_URL"].rstrip("/")
          username = os.environ["WP_USERNAME"]
          app_password = os.environ["WP_APP_PASSWORD"]

          post = {
              "title": "Uji Otomatisasi Threads",
              "content": "Ini adalah artikel uji dari GitHub Actions. Jika Anda melihatnya di WordPress, integrasi berhasil.",
              "status": "draft"
          }

          credentials = f"{username}:{app_password}".encode("utf-8")
          encoded_credentials = base64.b64encode(credentials).decode("ascii")

          request = urllib.request.Request(
              f"{wp_url}/wp-json/wp/v2/posts",
              data=json.dumps(post).encode("utf-8"),
              headers={
                  "Authorization": f"Basic {encoded_credentials}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions-wordpress-test"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  result = json.loads(response.read().decode("utf-8"))
                  print(f"Draft berhasil dibuat. ID: {result.get('id')}")
                  print(f"Status: {result.get('status')}")
          except urllib.error.HTTPError as error:
              details = error.read().decode("utf-8", errors="replace")
              print(f"WordPress mengembalikan HTTP {error.code}: {details}")
              raise
          PY
